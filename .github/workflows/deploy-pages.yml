name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @ralia/app
        env:
          # Projekt-Pages liegen unter /<repo>/, nicht an der Domainwurzel wie in
          # Produktion (siehe vite.config.ts).
          VITE_BASE_PATH: /Ralia/app/
      - name: SPA-Fallback fuer client-seitiges Routing
        run: cp apps/app/dist/index.html apps/app/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
