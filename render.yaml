services:
  - type: web
    name: ralia-app
    env: static
    # Die vollstaendige Verify-Suite laeuft in GitHub Actions. Render braucht
    # fuer die statische Site nur den reproduzierbaren Produktions-Build.
    buildCommand: npm ci && npm run build
    staticPublishPath: apps/app/dist
    envVars:
      # Render bedient die Site an der Domainwurzel, nicht unter /app/ wie die
      # spaetere Produktion (siehe apps/app/vite.config.ts).
      - key: VITE_BASE_PATH
        value: /
      - key: NODE_VERSION
        value: 22.22.0
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
